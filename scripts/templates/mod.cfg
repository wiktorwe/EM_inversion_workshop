# 2D electromagnetic TE mode modelling default configuration file

# Domain decomposition parameter
ndomain0 = "1"; # Number of domains along x direction to split the model into
ndomain1 = "1"; # Number of domains along z direction to split the model into

# Modelling parameters
# Order of finite difference stencil (1-8) = number of taps per side in
# Der<T>::ddx_fw/bw. rock-em's tabulated coefficients are dispersion-optimised
# (Holberg-type), NOT Taylor-exact, so they do not satisfy the staggered
# first-derivative consistency condition sum_n c_n (2n+1) = 1:
#
#   order   kappa=sum|w|   dt penalty   sum c_n(2n+1)   deviation
#     2       1.25886        1.000x        0.977010       -2.299 %
#     4       1.35764        1.078x        0.998488       -0.151 %
#     6       1.39907        1.111x        0.999882       -0.012 %
#     8       1.42313        1.130x        0.999990       -0.001 %
#
# At order 2 EVERY first derivative is under-scaled by 2.3 % regardless of dx,
# which rescales the discrete Laplacian by s^2 and hence the skin depth by s -
# an error that grows with offset/skin-depth and, crucially, does NOT converge
# away under grid refinement.
#
# Measured on this workshop's own FDTD-vs-analytic calibration
# (scripts/experiments/order_refinement.py), on the homogeneous 1 Ohm-m Earth
# where the receivers sit at 1.5-5.0 skin depths, with a clean extraction
# window:
#
#              |C|/dx^2 at 1 / 2 / 4 / 6 kHz            drift across the band
#   order 2    0.99018  0.97874  0.96149  0.94825            4.19 %
#   order 6    0.99954  0.99947  0.99938  0.99931            0.023 %
#
# and the C phase drift collapses from 2.9 deg to 0.13 deg while the residual
# scatter falls 5-10x. Order 8 is indistinguishable from order 6, so 6 is where
# this converges.
#
# THE DECISIVE TEST, because a correlation is not a mechanism: halving dx from
# 0.8 to 0.4 m at order 2 leaves the error exactly where it was (mean deficit
# 2.95 % -> 3.05 %, drift 4.19 % -> 4.34 %). A truncation error would have
# fallen by 4x. Non-convergence under refinement is the signature of an
# INCONSISTENT operator, which is what the coefficient table above predicts.
# At order 6 the same refinement takes the mean deficit to 0.004 %.
#
# 6 rather than 8 also because lpml must satisfy lpml >= order + 5: order 6
# needs 11 and lpml=13 has margin; order 8 needs exactly 13 and has none.
#
# Cost, measured (not estimated): ~2.0x wall-clock vs order 2 - 1.11x from the
# tighter CFL dt (kappa ratio) and the rest from the wider stencil per update.
#
# Must match design_explicit_fd's fd_order, which sizes dt from this value via
# rockem.utils.explicit_em_cfl_dt (order-aware; the engine's checkStability
# hard-aborts otherwise). resolve_fd_order_from_cfg reads it back out of here,
# so this cfg is the single place the order is set.
order = "6";
lpml = "13"; # Size of pml absorbing boundary (should be larger than order + 5 )
source_type = "3"; # Source type: 1=EY 3=HX 5=HZ
snapinc = "50"; # Snap interval in multiples of modelling interval
dtrec = "4.000000e-08"; # Recording interval in seconds
apertx = "90.000000"; # Aperture for local model (source is in the middle)
usepml = "true"; # Use PML for absorbing boundary conditions
pml_kmax = "28.35589468718386"; # PML Kmax parameter
pml_smax = "5118.462271590878"; # PML Smax parameter
pml_amax = "1641.117633701651"; # PML Amax parameter

# Booleans
Eyrecord = "false"; # Set these to true if recording or snapshoting is to be made.
Hxrecord = "true";
Hzrecord = "true";
Eysnap = "false";
Hxsnap = "false";
Hzsnap = "false";

# Files
Sg = "sg.rss";
Ep = "ep.rss";
Wavelet = "wav2d.rss";
Survey = "Survey.rss";
Eyrecordfile = "Data/Eyshot.rss";
Hxrecordfile = "Data/Hxshot.rss";
Hzrecordfile = "Data/Hzshot.rss";
Eysnapfile = "Snaps/Eysnaps.rss";
Hxsnapfile = "Snaps/Hxsnaps.rss";
Hzsnapfile = "Snaps/Hzsnaps.rss";
